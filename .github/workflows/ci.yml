name: CyberSWISS CI – Lint, Test & Audit

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Python lint + unit tests ──────────────────────────────────────────────
  python-tests:
    name: Python Lint & Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        # Rules come from .flake8 so this matches `make lint-python` exactly.
        run: flake8 common/ tests/ ci/collect_audit.py

      - name: Lint (pylint)
        run: |
          pylint common/ \
            --disable=C0114,C0115,C0116,R0903,W0611,R0801 \
            --fail-under=8.0

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=common --cov-report=term

  # ── Bash script static analysis ───────────────────────────────────────────
  bash-lint:
    name: Bash Lint (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on Linux scripts
        run: |
          find linux/ -name "*.sh" -print0 | xargs -0 -r shellcheck --severity=warning

  # ── Linux audit scripts smoke test ───────────────────────────────────────
  linux-smoke:
    name: Linux Scripts Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x linux/*.sh

      - name: Run L01 password policy (non-root smoke)
        run: python3 ci/collect_audit.py /tmp/l01.json -- bash linux/L01_password_policy.sh --json

      - name: Run L07 SSH posture check (non-root)
        run: python3 ci/collect_audit.py /tmp/l07.json -- bash linux/L07_ssh_posture.sh --json

      - name: Run L15 CIS baseline (non-root, some checks will warn)
        run: python3 ci/collect_audit.py /tmp/l15.json -- bash linux/L15_cis_baseline.sh --json

      - name: Run orchestrator dry-run
        run: python3 common/runner.py --os linux --dry-run

  # ── Orchestrator integration test ─────────────────────────────────────────
  orchestrator:
    name: Orchestrator Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # security-events: write lets the SARIF upload publish findings to the
    # repository's Security → Code scanning tab.
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Make scripts executable
        run: chmod +x linux/*.sh

      - name: Run orchestrator – Linux, min-severity Med
        run: |
          python3 ci/collect_audit.py /tmp/audit_report.json -- \
            python3 common/runner.py --json --os linux --min-severity Med --timeout 300

      - name: Verify JSON report was created
        run: |
          python3 -c "
          import json, sys
          with open('/tmp/audit_report.json') as f:
              data = json.load(f)
          assert data.get('cyberswiss_report'), 'Missing cyberswiss_report key'
          assert 'results' in data, 'Missing results key'
          print(f'Report OK: {data[\"scripts_run\"]} scripts, {data[\"total_findings\"]} findings')
          "

      - name: Generate HTML, SARIF and Markdown reports
        run: |
          python3 common/report_generator.py \
            /tmp/audit_report.json \
            --html     /tmp/audit_report.html \
            --sarif    /tmp/audit_report.sarif \
            --markdown /tmp/audit_report.md

      - name: Publish findings to the job summary
        run: cat /tmp/audit_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF to code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: /tmp/audit_report.sarif
          category: cyberswiss

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: |
            /tmp/audit_report.json
            /tmp/audit_report.html
            /tmp/audit_report.sarif
            /tmp/audit_report.md
          if-no-files-found: error

  # ── Baseline gate: fail only on findings that are not accepted risk ───────
  baseline-gate:
    name: Baseline Gate (new findings only)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Make scripts executable
        run: chmod +x linux/*.sh

      # Commit ci/baseline.json to the repository to record accepted risk.
      # Create one with:  python3 common/runner.py --write-baseline ci/baseline.json
      - name: Run audit against the committed baseline
        run: |
          if [ -f ci/baseline.json ]; then
            python3 common/runner.py --os linux --timeout 300 \
              --baseline ci/baseline.json --markdown - >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No accepted-risk baseline configured; host findings remain in the report."
            python3 ci/collect_audit.py /tmp/baseline-observation.json -- \
              python3 common/runner.py --json --os linux --timeout 300
            python3 common/report_generator.py /tmp/baseline-observation.json \
              --markdown - >> "$GITHUB_STEP_SUMMARY"
          fi
